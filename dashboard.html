<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MISA HELPER — Dashboard Demo</title>
  <style>
    :root {
      --bg: #0a0a0f; --panel: #12121a; --panel2: #171722;
      --green: #00ff9d; --cyan: #00e5ff; --text: #d0d0d8;
      --dim: #6b6b78; --red: #ff4d6d; --yellow: #ffd166; --border: #262633;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
    .topbar { display: flex; align-items: center; gap: 14px; padding: 14px 24px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .logo { font-weight: 700; font-size: 18px; color: var(--green); letter-spacing: 2px; font-family: 'Courier New', monospace; }
    .logo b { color: var(--cyan); }
    .nav-links { display: flex; gap: 18px; margin-left: auto; }
    .nav-links a { color: var(--dim); text-decoration: none; font-size: 14px; padding: 6px 10px; border-radius: 6px; transition: .2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--green); background: var(--panel2); }
    main { max-width: 1000px; margin: 30px auto; padding: 0 24px; }
    h2 { color: var(--cyan); font-size: 20px; margin-bottom: 18px; font-family: 'Courier New', monospace; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 18px; }
    .panel h3 { font-size: 14px; color: var(--green); margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .field label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
    .field input, .field select {
      width: 100%; padding: 10px 12px; background: var(--panel2);
      border: 1px solid var(--border); border-radius: 8px; color: var(--text);
      font-size: 14px; outline: none;
    }
    .field input:focus, .field select:focus { border-color: var(--green); }
    .row-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
    .btn {
      padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: .2s;
    }
    .btn-save { background: var(--green); color: #062; }
    .btn-save:hover { filter: brightness(1.15); }
    .btn-ghost { background: var(--panel2); color: var(--dim); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); }
    .log { font-family: 'Courier New', monospace; font-size: 12px; color: var(--dim); line-height: 1.7; }
    .log .ok { color: var(--green); }
    .log .info { color: var(--cyan); }
    footer { text-align: center; color: var(--dim); font-size: 12px; padding: 24px; border-top: 1px solid var(--border); margin-top: 30px; font-family: 'Courier New', monospace; }
    footer b { color: var(--green); }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } .nav-links { display: none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">MISA <b>HELPER</b></div>
    <nav class="nav-links">
      <a href="index.html">Overview</a>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="warn.html">Warn</a>
      <a href="ban.html">Ban</a>
      <a href="jail.html">Jail</a>
    </nav>
  </header>

  <main>
    <h2>Server Dashboard <span style="color:var(--dim)">— demo preview</span></h2>

    <div class="panel">
      <h3>Guild Settings</h3>
      <div class="grid">
        <div class="field">
          <label>Prefix</label>
          <input value="+" />
        </div>
        <div class="field">
          <label>Auto Role</label>
          <select><option>— Auto role on join —</option><option>Members</option></select>
        </div>
        <div class="field">
          <label>Moderation Log Channel</label>
          <select><option>#mod-logs</option></select>
        </div>
        <div class="field">
          <label>Muter Role</label>
          <select><option>Muted</option></select>
        </div>
        <div class="field">
          <label>Jail Role</label>
          <select><option>Jailed</option></select>
        </div>
        <div class="field">
          <label>Verification Role</label>
          <select><option>Verified</option></select>
        </div>
      </div>
      <div class="row-actions">
        <button class="btn btn-ghost">Reset</button>
        <button class="btn btn-save">Save Changes</button>
      </div>
    </div>

    <div class="panel">
      <h3>Recent Activity</h3>
      <div class="log">
        <div><span class="ok">[ OK ]</span>  profile initialized</div>
        <div><span class="info">➜</span>    loading guild configuration...</div>
        <div><span class="info">➜</span>    syncing slash commands...</div>
        <div><span class="ok">[ OK ]</span>  dashboard ready</div>
      </div>
    </div>
  </main>

  <footer>Developed by <b>Farma</b></footer>
</body>
</html>
